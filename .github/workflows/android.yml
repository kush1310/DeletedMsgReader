name: Build & Release NotiCatch Android APK

# Trigger: every push to main (CI build + artifact), every v* tag (CI + GitHub Release)
on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android Assets
        run: npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      # Resolve the release version:
      #   - On a tag push (e.g. v2.0.1): TAG_NAME = v2.0.1
      #   - On a branch push / PR:      TAG_NAME = v{version from package.json}
      - name: Resolve Release Tag Name
        id: resolve_tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          else
            PKG_VERSION=$(node -p "require('./package.json').version")
            TAG_NAME="v${PKG_VERSION}"
          fi
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: ${TAG_NAME}"

      # Copy the APK to release-apks/ using the versioned name.
      # Exactly ONE standalone .apk is created — no zip archives and no duplicate APKs.
      - name: Prepare Named APK File
        run: |
          TAG="${{ steps.resolve_tag.outputs.tag_name }}"
          mkdir -p release-apks
          # Dedicated versioned APK — e.g. NotiCatch-v2.0.1.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk "release-apks/NotiCatch-${TAG}.apk"
          echo "Contents of release-apks/:"
          ls -lh release-apks/
          # Verify the file is a valid Android APK
          for f in release-apks/*.apk; do
            MAGIC=$(xxd -l 4 "$f" | awk '{print $2$3}')
            if [[ "$MAGIC" != "504b0304" ]]; then
              echo "ERROR: $f is not a valid APK package (magic: $MAGIC)"
              exit 1
            fi
            echo "VERIFIED: $f is a valid Android package"
          done

      # Upload single dedicated APK as Actions artifact
      - name: Upload APK as Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NotiCatch-${{ steps.resolve_tag.outputs.tag_name }}
          path: release-apks/NotiCatch-${{ steps.resolve_tag.outputs.tag_name }}.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      # Only runs on v* tag pushes — attaches the single dedicated .apk asset to the GitHub Release.
      # Users can download NotiCatch-v2.0.1.apk directly from the release assets.
      - name: Publish GitHub Release with Direct APK Asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: "NotiCatch ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          body: |
            ## NotiCatch ${{ github.ref_name }}

            ### Direct APK Download
            - **Download APK**: [NotiCatch-${{ github.ref_name }}.apk](https://github.com/kush1310/DeletedMsgReader/releases/download/${{ github.ref_name }}/NotiCatch-${{ github.ref_name }}.apk)

            ### Installation Instructions
            1. Download the **NotiCatch-${{ github.ref_name }}.apk** file from the Assets section below.
            2. On your Android device, allow installation from unknown sources if prompted.
            3. Open the `.apk` file to install NotiCatch.
            4. Grant Notification Access and Battery Optimization exemption when prompted.

            > **Note:** The "Source code (zip)" and "Source code (tar.gz)" links below are standard GitHub source archives. Always download the `.apk` file for installation.
          files: |
            release-apks/NotiCatch-${{ github.ref_name }}.apk
          generate_release_notes: false
          draft: false
          prerelease: false
